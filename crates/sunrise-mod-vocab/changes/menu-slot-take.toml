ids = ["hook:menu_slot_take", "type:MenuSlotTakeEvent"]
why = "Nothing ran on the server when a player took a stack out of a mod menu type's own slot, so a result slot could not give experience, unlock a recipe or use up its inputs. menu_slot_take (version 1) was Slot.onTake for a mod menu type open on a mod block entity: a block-entity-scoped notice on the server, keyed by the entity, after the item left the slot, with the player, the menu type, the menu slot, the stack taken and what the slot holds afterwards. It replaced the menu-scoped menu_slot_take that was removed before any SDK shipped it, and was later moved to MenuPart version 2 in blockless-menu-slot-take.toml to cover both block-backed and blockless owned menus."
migrate = "Version 1 was superseded by MenuPart::menu_slot_take version 2; see blockless-menu-slot-take.toml."
